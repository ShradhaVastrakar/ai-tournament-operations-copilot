version: "3.8"

# Images are built by the Jenkinsfile (docker build ...); compose only runs them.
# Values come from the .env file placed next to this file (see .env.docker.example).

services:
  ai_tournament_ai_service:
    image: ai_tournament_ai_service:latest
    container_name: ai_tournament_ai_service
    # Not published to the host: only the Express API talks to it over the docker network
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.1-8b-instant}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_DISTANCE: ${RAG_MAX_DISTANCE:-0.75}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - ktspl-network

  ai_tournament_api:
    image: ai_tournament_api:latest
    container_name: ai_tournament_api
    ports:
      - "${API_HOST_PORT:-4011}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      AI_SERVICE_URL: http://ai_tournament_ai_service:8000
      BODY_LIMIT: ${BODY_LIMIT:-1mb}
    depends_on:
      ai_tournament_ai_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ktspl-network

  ai_tournament_web:
    image: ai_tournament_web:latest
    container_name: ai_tournament_web
    ports:
      - "${WEB_HOST_PORT:-4010}:3000"
    depends_on:
      - ai_tournament_api
    restart: unless-stopped
    networks:
      - ktspl-network

networks:
  ktspl-network:
    external: true
